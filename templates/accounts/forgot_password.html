{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 70vh; padding: 4rem 0;">
    <div class="row justify-content-center w-100">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 64px; height: 64px;">
                            <i class="bi bi-key-fill fs-2"></i>
                        </div>
                        <h2 class="fw-bold mb-1">Forgot Password?</h2>
                        <p class="text-muted small">Enter your email address and we'll send you a link to reset your password.</p>
                    </div>
                    
                    <form method="POST">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn-primary-custom w-100 py-3 text-center d-flex justify-content-center align-items-center">Send Reset Link</button>
                        </div>
                    </form>
                    
                    <p class="text-center mt-3 mb-0 small text-muted">
                        Remember your password? <a href="{% url 'login' %}" class="fw-semibold text-primary">Login here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
