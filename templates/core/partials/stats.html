{% load static %}
<section class="stats-section" id="stats">
    <div class="container">
        <div class="row g-4 justify-content-center">
            <!-- Stat Card 1 -->
            <div class="col-6 col-lg-3">
                <div class="stat-card animate-on-scroll animate-delay-1">
                    <div class="stat-icon"><i class="bi bi-cpu"></i></div>
                    <div class="stat-number">AI-Powered</div>
                    <div class="stat-label">Resume & Skill Gap Analysis</div>
                </div>
            </div>
            
            <!-- Stat Card 2 -->
            <div class="col-6 col-lg-3">
                <div class="stat-card animate-on-scroll animate-delay-2">
                    <div class="stat-icon"><i class="bi bi-signpost-2"></i></div>
                    <div class="stat-number"><span class="counter" data-target="15">0</span>+ Paths</div>
                    <div class="stat-label">Curated Career Roadmaps</div>
                </div>
            </div>
            
            <!-- Stat Card 3 -->
            <div class="col-6 col-lg-3">
                <div class="stat-card animate-on-scroll animate-delay-3">
                    <div class="stat-icon"><i class="bi bi-camera-video"></i></div>
                    <div class="stat-number">Real-Time</div>
                    <div class="stat-label">AI Proctored Mock Interviews</div>
                </div>
            </div>
            
            <!-- Stat Card 4 -->
            <div class="col-6 col-lg-3">
                <div class="stat-card animate-on-scroll animate-delay-4">
                    <div class="stat-icon"><i class="bi bi-people"></i></div>
                    <div class="stat-number">1-on-1</div>
                    <div class="stat-label">Industry Mentorship & Support</div>
                </div>
            </div>
        </div>
    </div>
</section>
