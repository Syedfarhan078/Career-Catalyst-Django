        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto"> <!-- Centered links for Stripe-style aesthetic -->

                <li class="nav-item">
                    <a class="nav-link" href="#how-it-works">How It Works</a>
