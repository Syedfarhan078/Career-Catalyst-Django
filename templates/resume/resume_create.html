{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Create Resume - Career Catalyst{% endblock %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 rounded-4 p-4">
                <div class="text-center mb-4">
                    <div class="display-4 text-primary mb-3">
                        <i class="bi bi-file-earmark-plus"></i>
                    </div>
                    <h2 class="fw-bold">Create New Resume</h2>
                    <p class="text-muted">Start by giving your resume a title and choosing a layout template.</p>
                </div>
                
                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary-custom btn-lg">
                            Continue to Builder <i class="bi bi-arrow-right ms-2"></i>
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-3">
                    <a href="{% url 'resume:list' %}" class="text-decoration-none text-muted">
                        <i class="bi bi-arrow-left"></i> Back to My Resumes
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
